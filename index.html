<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#111;color:#fff;font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
#bar{display:flex;gap:4px 12px;align-items:center;padding:4px 8px;background:#b71c1c;font-weight:bold;font-size:clamp(11px,2.5vw,15px);flex-wrap:wrap}
#bar span{white-space:nowrap}.sp{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:6px 12px;background:#ffd600;color:#222;font-weight:bold;margin:3px}
#bar button{padding:3px 9px;margin:0}
#wrap{flex:1;min-height:0;position:relative;background:#000}
canvas{width:100%;height:100%;object-fit:contain;display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);text-align:center;overflow:auto}
#ov.h{display:none}
.card{padding:14px;max-width:560px}
h1{margin:.2em 0;color:#ffd600;text-shadow:3px 3px #b71c1c;font-size:clamp(22px,6vw,40px)}
.lv{min-width:130px}.lv[disabled]{opacity:.4;cursor:default}
#tc{position:absolute;left:0;right:0;bottom:8px;display:none;justify-content:space-between;padding:0 12px;pointer-events:none}
@media(pointer:coarse){#tc{display:flex}}
.g{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.tb{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.55);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.go{width:min(94vw,560px);margin:auto;background:#1a0707;border:4px solid #ffd600;border-radius:14px;overflow:hidden;box-shadow:0 0 30px #000;animation:pop .5s}
.hero{position:relative;height:clamp(150px,34vh,300px)}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.9))}
.gt{position:absolute;left:0;right:0;bottom:6px;margin:0;font-size:clamp(24px,7.2vw,42px);font-weight:900;color:#ffe600;text-shadow:3px 3px 0 #d6001c,0 0 14px #000;letter-spacing:1px;animation:wob 1.4s infinite}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}@keyframes wob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) scale(1.04)}}
.sub{margin:8px;font-size:14px;color:#ffd0d0}.st{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 10px}
.st div{background:rgba(255,255,255,.09);border-radius:8px;padding:6px;display:flex;flex-direction:column}.st span{font-size:11px;opacity:.8}.st b{font-size:clamp(14px,3.8vw,18px);color:#ffd600}.bt{padding:6px 10px 12px}
@media(max-height:420px){.hero{height:84px}.sub{margin:3px}.st div{padding:3px 6px}.gt{font-size:clamp(20px,5vw,30px)}}
@media(max-width:460px){.tb{width:52px;height:52px}.tb.s{width:38px;height:38px}}
.tb.s{width:44px;height:44px;font-size:14px}.tb.on{background:rgba(255,214,0,.65)}
